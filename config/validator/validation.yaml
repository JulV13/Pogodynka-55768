App\Entity\Location:
    properties:
        city:
            - NotBlank:
                  groups: ['create', 'edit']
        country:
            - NotBlank:
                  groups: ['create', 'edit']
        latitude:
            - Range:
                  min: -90
                  max: 90
                  notInRangeMessage: 'Latitude must be between {{ min }} and {{ max }}.'
                  groups: ['create', 'edit']
        longtitude:
            - Range:
                  min: -180
                  max: 180
                  notInRangeMessage: 'Longtitude must be between {{ min }} and {{ max }}.'
                  groups: ['create', 'edit']

App\Entity\Measurement:
    properties:
        date:
            - NotBlank:
                  groups: ['create', 'edit']
        temperatureCelsius:
            - NotBlank:
                  groups: ['create']
            - Type:
                  type: numeric
                  groups: ['create', 'edit']
        location:
            - NotNull:
                  groups: ['create', 'edit']
